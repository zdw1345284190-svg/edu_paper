<script>
// ============================================================
// ANSWER KEY
// ============================================================
const KEY = {
    single: { 1:'B', 2:'A', 3:'B', 4:'B', 5:'B', 6:'C', 7:'B', 8:'C', 9:'C', 10:'B' },
    multi: { 11:['A','C'], 12:['A','B','C','D'], 13:['A','B','D'] },
    fill: { 14:'-4', 15:'<', 16:'伪<0', 17:'3' }
};
const STORAGE_KEY = 'math_260730_ans';
const MAX_SCORES = { single:30, multi:12, fill:16, essay:42, total:100 };

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveAnswers() {
    const data = {};
    document.querySelectorAll('input[type="radio"]:checked').forEach(el => {
        data[el.name] = el.value;
    });
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(el => {
        if (!data[el.name]) data[el.name] = [];
        data[el.name].push(el.value);
    });
    document.querySelectorAll('input[type="text"]').forEach(el => {
        if (el.id !== 'studentName' && el.id !== 'studentClass') {
            data[el.name] = el.value;
        }
    });
    // Save student info
    data['_name'] = document.getElementById('studentName').value;
    data['_class'] = document.getElementById('studentClass').value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadAnswers() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        // Student info
        if (data['_name']) document.getElementById('studentName').value = data['_name'];
        if (data['_class']) document.getElementById('studentClass').value = data['_class'];
        // Answers
        Object.entries(data).forEach(([name, val]) => {
            if (name.startsWith('_')) return;
            if (Array.isArray(val)) {
                val.forEach(v => {
                    const cb = document.querySelector(`input[name="${name}"][value="${v}"]`);
                    if (cb) cb.checked = true;
                });
            } else {
                const radio = document.querySelector(`input[name="${name}"][value="${val}"]`);
                if (radio) { radio.checked = true; return; }
                const inp = document.querySelector(`input[name="${name}"]`);
                if (inp && inp.type === 'text') inp.value = val;
            }
        });
    } catch(e) {}
}

// ============================================================
// UTILITY
// ============================================================
function norm(s) {
    return s.trim().replace(/\s+/g,'').replace(/伪/g,'a').toLowerCase();
}

function checkFill(user, correct) {
    if (!user) return false;
    const u = norm(user), c = norm(correct);
    if (u === c) return true;
    // Accept "(-鈭?0)" or "a<0" variations for q16
    if (u === '(-鈭?0)' || u === '(-inf,0)' || u === 'a<0' || u === 'negative') return c === 'a<0' || c === '伪<0';
    return false;
}

function clearFeedback() {
    document.querySelectorAll('.correct-label,.wrong-label').forEach(el => el.classList.remove('correct-label','wrong-label'));
    document.querySelectorAll('.answer-show').forEach(el => el.remove());
    document.querySelectorAll('.blank-input').forEach(el => {
        el.style.color = ''; el.style.borderBottomColor = '';
    });
    document.querySelectorAll('.essay-area').forEach(el => {
        el.style.borderColor = '#ccc';
    });
}

// ============================================================
// PASSWORD DIALOG
// ============================================================
function showPasswordDialog() {
    // Prevent double overlay
    if (document.querySelector('.pwd-overlay')) return;

    const overlay = document.createElement('div');
    overlay.className = 'pwd-overlay';
    overlay.innerHTML = `
        <div class="pwd-dialog">
            <h3>馃敀 纭浜ゅ嵎</h3>
            <p>璇疯緭鍏ヤ氦鍗峰瘑鐮佸悗鏌ョ湅鎴愮哗涓庣瓟妗?/p>
            <input type="password" id="pwdInput" placeholder="璇疯緭鍏ュ瘑鐮? autofocus>
            <div>
                <button class="btn btn-primary" onclick="submitWithPassword()">纭浜ゅ嵎</button>
                <button class="btn btn-secondary" onclick="closePwdDialog()">鍙栨秷</button>
            </div>
            <div class="pwd-error" id="pwdError"></div>
        </div>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => document.getElementById('pwdInput').focus(), 100);
    document.getElementById('pwdInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') submitWithPassword();
    });
}

function closePwdDialog() {
    const el = document.querySelector('.pwd-overlay');
    if (el) el.remove();
}

function submitWithPassword() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd !== '2641') {
        document.getElementById('pwdError').textContent = '瀵嗙爜閿欒锛岃閲嶈瘯锛?;
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
        return;
    }
    closePwdDialog();
    submitAndGrade();
}

// ============================================================
// ESSAY SELF-SCORE
// ============================================================
function updateEssayTotal() {
    const s18 = parseInt(document.getElementById('selfScore18').value) || 0;
    const s19 = parseInt(document.getElementById('selfScore19').value) || 0;
    const s20 = parseInt(document.getElementById('selfScore20').value) || 0;
    const essayTotal = Math.min(s18 + s19 + s20, 42);
    document.getElementById('essayScoreDisp').textContent = essayTotal + '/42';

    // Get objective scores
    const singleTxt = document.getElementById('singleScore').textContent;
    const multiTxt = document.getElementById('multiScore').textContent;
    const fillTxt = document.getElementById('fillScore').textContent;

    const single = parseInt(singleTxt) || 0;
    const multi = parseInt(multiTxt) || 0;
    const fill = parseInt(fillTxt) || 0;
    const grand = single + multi + fill + essayTotal;
    document.getElementById('grandScoreDisp').textContent = grand + '/100';
    document.getElementById('totalScoreDisplay').textContent = grand + ' / 100';
    document.getElementById('headerScoreLabel').textContent = '寰楀垎锛? + grand + '鍒?;
}

// ============================================================
// MAIN GRADING
// ============================================================
function submitAndGrade() {
    saveAnswers();
    clearFeedback();

    let singleScore = 0, multiScore = 0, fillScore = 0;

    // --- Single choice (1-10) ---
    for (let i = 1; i <= 10; i++) {
        const radios = document.getElementsByName('q' + i);
        let selected = null;
        for (const r of radios) { if (r.checked) { selected = r.value; break; } }
        const correct = KEY.single[i];
        const isCorrect = selected === correct;
        if (isCorrect) singleScore += 3;

        for (const r of radios) {
            const lbl = r.closest('label');
            if (r.value === correct) lbl.classList.add('correct-label');
            if (r.checked && r.value !== correct) lbl.classList.add('wrong-label');
        }
    }

    // --- Multi choice (11-13) ---
    for (let i = 11; i <= 13; i++) {
        const checked = document.querySelectorAll(`input[name="q${i}"]:checked`);
        const user = Array.from(checked).map(cb => cb.value).sort();
        const correct = KEY.multi[i].slice().sort();

        let score = 0;
        const hasWrong = user.some(v => !correct.includes(v));
        if (!hasWrong) {
            if (user.length === correct.length && correct.every(v => user.includes(v))) {
                score = 4;
            } else if (user.length > 0) {
                score = 2;
            }
        }
        multiScore += score;

        for (const cb of document.querySelectorAll(`input[name="q${i}"]`)) {
            const lbl = cb.closest('label');
            if (correct.includes(cb.value)) lbl.classList.add('correct-label');
            if (cb.checked && !correct.includes(cb.value)) lbl.classList.add('wrong-label');
        }
    }

    // --- Fill-in blanks (14-17) ---
    for (const [qid, correct] of Object.entries(KEY.fill)) {
        const input = document.querySelector(`input[name="q${qid}"]`);
        if (!input) continue;
        const userVal = input.value.trim();
        const isCorrect = checkFill(userVal, correct);
        if (isCorrect) fillScore += 4;

        if (!isCorrect && userVal !== '') {
            const span = document.createElement('span');
            span.className = 'answer-show';
            span.textContent = '鉁?姝ｇ‘绛旀锛? + correct;
            input.parentNode.insertBefore(span, input.nextSibling);
        } else if (isCorrect) {
            input.style.color = '#1b7a1b';
            input.style.borderBottomColor = '#1b7a1b';
        }
    }

    // --- Display results ---
    document.getElementById('singleScore').textContent = singleScore + '/30';
    document.getElementById('multiScore').textContent = multiScore + '/12';
    document.getElementById('fillScore').textContent = fillScore + '/16';

    // Reset essay display
    document.getElementById('essayScoreDisp').textContent = '--/42';

    const autoTotal = singleScore + multiScore + fillScore;
    document.getElementById('totalScoreDisplay').textContent = autoTotal + ' / 100锛堝瑙傞閮ㄥ垎锛岄渶鑷瘎瑙ｇ瓟棰橈級';
    document.getElementById('headerScoreLabel').textContent = '瀹㈣棰橈細' + autoTotal + '鍒?;

    // Show result box
    document.getElementById('resultBox').classList.add('visible');

    // Show answer key
    document.getElementById('answerSection').classList.add('visible');

    // Show self-score sections
    document.querySelectorAll('.essay-score').forEach(el => el.classList.add('visible'));

    // Scroll to results
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Re-render MathJax for answer key
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

// ============================================================
// CLEAR ALL
// ============================================================
function clearAll() {
    if (!confirm('纭畾瑕佹竻绌烘墍鏈夌瓟妗堝悧锛?)) return;
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => el.checked = false);
    document.querySelectorAll('input[type="text"]').forEach(el => { if (el.id !== 'studentName' && el.id !== 'studentClass') el.value = ''; });
    document.querySelectorAll('.essay-area').forEach(el => el.value = '');
    clearFeedback();
    document.getElementById('resultBox').classList.remove('visible');
    document.getElementById('answerSection').classList.remove('visible');
    document.querySelectorAll('.essay-score').forEach(el => el.classList.remove('visible'));
    document.getElementById('headerScoreLabel').textContent = '寰楀垎锛氣€斺€?;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '鎻愪氦绛斿嵎锛圕trl+Enter锛?;
}

// ============================================================
// SAVE TO FILE (basic print)
// ============================================================
function saveToFile() {
    window.print();
}

// ============================================================
// KEYBOARD SHORTCUT
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'Enter' || e.keyCode === 13)) {
        e.preventDefault();
        showPasswordDialog();
    }
});

// ============================================================
// AUTO-SAVE ON CHANGE
// ============================================================
document.addEventListener('change', function(e) {
    if (e.target.matches('input[type="radio"], input[type="checkbox"], input[type="text"], .essay-area')) {
        saveAnswers();
    }
});
document.addEventListener('input', function(e) {
    if (e.target.matches('input[type="text"], .essay-area')) {
        saveAnswers();
    }
});

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    loadAnswers();

    // After MathJax renders, we may need to re-run for answer key visibility
    // (Answer key starts hidden, so no issue)
    // If coming back after previous submission, re-show results if they exist
    // Check localStorage for a flag
    const submitted = localStorage.getItem(STORAGE_KEY + '_submitted');
    if (submitted === 'true') {
        // Don't auto-submit, just restore previous state
    }
});
