        <strong>锛?锛?/strong> $L(x)=-20(x-50)^2+8000$锛屽綋 $x=50$ 鏃讹紝$L_{\max}=8000$锛堝厓锛夈€?br>
        绛旓細鍞环瀹氫负50鍏冩椂鏈堝埄娑︽渶澶э紝鏈€澶ф湀鍒╂鼎涓?000鍏冦€?br>
        <span style="color:#888;font-size:9pt;">璇勫垎锛氳В鏋愬紡4鍒嗭紝閰嶆柟3鍒嗭紝缁撹3鍒嗐€?/span>

        <strong>锛?锛?/strong> $f(-x)=x^2-2ax+1=f(x)=x^2+2ax+1$ 鈫?$-2ax=2ax$ 鈫?$a=0$锛?鍒嗭級锛?f(x)=x^2+1$ 閫掑鍖洪棿涓?$[0,+\infty)$锛?鍒嗭級銆?br>
        <strong>锛?锛?/strong> $f(1)=1+2a+1=4$ 鈫?$a=1$锛?鍒嗭級锛?f(x)=x^2+2x+1=(x+1)^2$锛屽绉拌酱 $x=-1\le3$锛屽湪 $[3,+\infty)$ 涓婇€掑锛?鍒嗭級锛涘湪 $[-1,5]$ 涓婏紝$f_{\min}=f(-1)=0$锛?f_{\max}=f(5)=36$锛屽€煎煙 $[0,36]$锛?鍒嗭級銆?br>
        <span style="color:#888;font-size:9pt;">璇勫垎锛氭寜灏忛棶鍒嗗€肩粰鍒嗭紝鍏抽敭姝ラ缂烘紡閰屾儏鎵ｅ垎銆?/span>

        <strong>锛?锛?/strong> $L(x)=-2(x^2-25x+100)=-2\left[(x-12.5)^2-56.25\right]=-2(x-12.5)^2+112.5$銆傦紙4鍒嗭級<br>
        褰?$x=12.5$锛堜竾浠讹級鏃讹紝$L_{\max}=112.5$锛堜竾鍏冿級銆傦紙4鍒嗭級<br>
        绛旓細褰撳勾浜ч噺涓?2.5涓囦欢鏃讹紝骞村埄娑︽渶澶э紝鏈€澶у勾鍒╂鼎涓?12.5涓囧厓銆?br>
        <span style="color:#888;font-size:9pt;">璇勫垎锛氳В鏋愬紡4鍒嗭紝閰嶆柟4鍒嗭紝缁撹4鍒嗐€?/span>

<div class="pwd-overlay" id="pwdOverlay">

    <h3>馃敀 璇疯緭鍏ョ瓟妗堝瘑鐮?/h3>
    <input type="password" id="pwdInput" maxlength="10" placeholder="璇疯緭鍏ュ瘑鐮? autocomplete="off">
    <div class="pwd-err" id="pwdErr">瀵嗙爜閿欒锛岃閲嶈瘯</div>

      <button class="btn btn-primary" onclick="checkPassword()">纭</button>

<!-- ============================================================ -->
<script>
(function(){
  'use strict';

  /* ========================== 绛旀鏁版嵁 ========================== */
  var CORRECT = {
    // 鍗曢€?    1: 'B', 2: 'B', 3: 'C', 4: 'A', 5: 'D',
    6: 'A', 7: 'A', 8: 'B', 9: 'C', 10: 'C',
    // 澶氶€?(鏁扮粍)
    11: ['A','B','C','D'],
    12: ['A','B','D'],
    13: ['A','B','D'],
    // 濉┖
    14: ['3x-8', '3x鈭?', '3x - 8', '3x 鈭?8'],
    15: ['20'],
    16: ['a鈮?2', 'a <= -2', 'a<-2', 'a < -2', 'a 鈮?-2', 'a 鈮?鈭?'],
    17: ['3']
  };

  /* ========================== 鎵规敼 ========================== */
  window.gradeTest = function() {
    var total = 0;
    var details = [];
    var MAX_Q = 17; // 1-17 涓哄瑙傞

    // ----- 鍗曢€?(1-10) -----
    var singleScore = 3;
    for (var i = 1; i <= 10; i++) {
      var sel = document.querySelector('input[name="q'+i+'"]:checked');
      var userVal = sel ? sel.value : null;
      var correctVal = CORRECT[i];
      var qId = 'q'+i;
      var qBlock = document.getElementById(qId);
      // 娓呴櫎鏃ф爣璁?      clearMark(qBlock);
      if (userVal === correctVal) {
        total += singleScore;
        showMark(qBlock, '鉁?+'+singleScore, 'correct-mark');
        details.push('绗?+i+'棰?鉁?(3鍒?');
      } else if (userVal === null) {
        showMark(qBlock, '鏈€?(0鍒?', 'wrong-mark');
        details.push('绗?+i+'棰?鏈€?(0鍒?');
      } else {
        showMark(qBlock, '鉁?(0鍒?', 'wrong-mark');
        details.push('绗?+i+'棰?鉁?閫?+userVal+' (0鍒?');
      }
    }

    // ----- 澶氶€?(11-13) -----
    for (var j = 11; j <= 13; j++) {
      var checked = document.querySelectorAll('input[name="q'+j+'"]:checked');
      var selected = [];
      checked.forEach(function(cb){ selected.push(cb.value); });
      var correct = CORRECT[j]; // array
      var qBlock2 = document.getElementById('q'+j);
      clearMark(qBlock2);

      // 鍒ゆ柇閫昏緫
      var hasWrong = selected.some(function(v){ return correct.indexOf(v) === -1; });
      var allCorrect = selected.length === correct.length && !hasWrong;

      if (selected.length === 0) {
        showMark(qBlock2, '鏈€?(0鍒?', 'wrong-mark');
        details.push('绗?+j+'棰?鏈€?(0鍒?');
      } else if (hasWrong) {
        showMark(qBlock2, '鏈夐€夐敊 (0鍒?', 'wrong-mark');
        details.push('绗?+j+'棰?鏈夐€夐敊 (0鍒?');
      } else if (allCorrect) {
        total += 4;
        showMark(qBlock2, '鉁?+4鍒?, 'correct-mark');
        details.push('绗?+j+'棰?鉁?鍏ㄥ (4鍒?');
      } else {
        // 閮ㄥ垎閫夊锛堟棤閿欎絾鏈叏閫夛級
        total += 2;
        showMark(qBlock2, '閮ㄥ垎閫夊 +2鍒?, 'partial-mark');
        details.push('绗?+j+'棰?閮ㄥ垎閫夊 (2鍒?');
      }
    }

    // ----- 濉┖ (14-17) -----
    var fillScore = 4;
    for (var k = 14; k <= 17; k++) {
      var input = document.getElementById('f'+k);
      var userAns = input.value.trim();
      var correctAns = CORRECT[k]; // array of acceptable answers
      var qBlock3 = document.getElementById('q'+k);
      clearMark(qBlock3);

      // 鏍囧噯鍖栵細鍘荤┖鏍硷紝缁熶竴鍑忓彿
      var norm = userAns.replace(/\s+/g, '');
      var matched = correctAns.some(function(ca) {
        var caNorm = ca.replace(/\s+/g, '');
        // 澶勭悊 Unicode 鍑忓彿
        caNorm = caNorm.replace(/鈭?g, '-');
        norm = norm.replace(/鈭?g, '-');
        return norm === caNorm;
      });

      if (userAns === '') {
        showMark(qBlock3, '鏈～ (0鍒?', 'wrong-mark');
        details.push('绗?+k+'棰?鏈～ (0鍒?');
      } else if (matched) {
        total += fillScore;
        showMark(qBlock3, '鉁?+'+fillScore, 'correct-mark');
        details.push('绗?+k+'棰?鉁?(4鍒?');
      } else {
        showMark(qBlock3, '鉁?(0鍒?', 'wrong-mark');
        details.push('绗?+k+'棰?鉁?濉?'+userAns+'" (0鍒?');
      }
    }

    // ----- 鏄剧ず鎬诲垎 -----
    document.getElementById('finalScore').textContent = total + ' / 100';
    document.getElementById('scoreDetail').textContent = details.join(' 锝?');
    document.getElementById('scoreBox').style.display = 'block';
    document.getElementById('displayScore').textContent = total + '鍒?;

    // 淇濆瓨鍒?localStorage
    saveAnswers();

    // 婊氬姩鍒板垎鏁?    document.getElementById('scoreBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  /* 杈呭姪锛氭竻闄ゆ爣璁?*/
  function clearMark(el) {
    var old = el.querySelector('.q-result');
    if (old) old.remove();
    // 鎭㈠鑳屾櫙
    el.style.backgroundColor = '';
  }

  /* 杈呭姪锛氭樉绀烘爣璁?*/
  function showMark(el, text, cls) {
    var span = document.createElement('span');
    span.className = 'q-result ' + cls;
    span.textContent = text;
    el.appendChild(span);
  }

  /* ========================== localStorage ========================== */
  var STORAGE_KEY = 'math260801_answers';

  window.saveAnswers = function() {
    var data = {};
    // 鍗曢€?    for (var i = 1; i <= 10; i++) {
      var sel = document.querySelector('input[name="q'+i+']:checked');
      data['q'+i] = sel ? sel.value : '';
    }
    // 澶氶€?    for (var j = 11; j <= 13; j++) {
      var checked = document.querySelectorAll('input[name="q'+j+']:checked');
      var vals = [];
      checked.forEach(function(cb){ vals.push(cb.value); });
      data['q'+j] = vals;
    }
    // 濉┖
    for (var k = 14; k <= 17; k++) {
      data['q'+k] = document.getElementById('f'+k).value;
    }
    // 瑙ｇ瓟棰?& 闄勫姞棰?    for (var m = 18; m <= 21; m++) {
      data['q'+m] = document.getElementById('t'+m).value;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      showToast('绛旀宸蹭繚瀛?鉁?);
    } catch(e) {
      showToast('淇濆瓨澶辫触锛?+e.message);
    }
  };

  window.loadAnswers = function() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { showToast('鏈壘鍒板凡淇濆瓨鐨勭瓟妗?); return; }
      var data = JSON.parse(raw);
      // 鍗曢€?      for (var i = 1; i <= 10; i++) {
        var val = data['q'+i];
        if (val) {
          var radio = document.querySelector('input[name="q'+i+'"][value="'+val+'"]');
          if (radio) radio.checked = true;
        }
      }
      // 澶氶€?      for (var j = 11; j <= 13; j++) {
        var vals = data['q'+j];
        if (Array.isArray(vals)) {
          vals.forEach(function(v) {
            var cb = document.querySelector('input[name="q'+j+'"][value="'+v+'"]');
            if (cb) cb.checked = true;
          });
        }
      }
      // 濉┖
      for (var k = 14; k <= 17; k++) {
        if (data['q'+k]) document.getElementById('f'+k).value = data['q'+k];
      }
      // 瑙ｇ瓟 & 闄勫姞
      for (var m = 18; m <= 21; m++) {
        if (data['q'+m]) document.getElementById('t'+m).value = data['q'+m];
      }
      showToast('绛旀宸叉仮澶?鉁?);
      // 閲嶆柊娓叉煋 MathJax
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    } catch(e) {
      showToast('鎭㈠澶辫触锛?+e.message);
    }
  };

  window.resetAll = function() {
    if (!confirm('纭畾瑕佹竻绌烘墍鏈夌瓟妗堝悧锛?)) return;
    // 娓呯┖鍗曢€?    document.querySelectorAll('input[type="radio"]').forEach(function(el){ el.checked = false; });
    // 娓呯┖澶氶€?    document.querySelectorAll('input[type="checkbox"]').forEach(function(el){ el.checked = false; });
    // 娓呯┖濉┖
    document.querySelectorAll('.fill-blank').forEach(function(el){ el.value = ''; });
    // 娓呯┖瑙ｇ瓟
    document.querySelectorAll('textarea').forEach(function(el){ el.value = ''; });
    // 娓呴櫎鏍囪
    document.querySelectorAll('.q-result').forEach(function(el){ el.remove(); });
    document.querySelectorAll('.q-block').forEach(function(el){ el.style.backgroundColor = ''; });
    // 闅愯棌鍒嗘暟
    document.getElementById('scoreBox').style.display = 'none';
    document.getElementById('displayScore').textContent = '鈥?;
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
    showToast('宸叉竻绌烘墍鏈夌瓟妗?);
  };

  /* ========================== 绠€鍗?Toast ========================== */
  function showToast(msg) {
    var div = document.createElement('div');
    div.textContent = msg;
    div.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);' +
      'background:#333;color:#fff;padding:10px 28px;border-radius:6px;font-size:11pt;' +
      'z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,0.2);transition:opacity 0.3s;';
    document.body.appendChild(div);
    setTimeout(function() {
      div.style.opacity = '0';
      setTimeout(function(){ div.remove(); }, 400);
    }, 2000);
  }

  /* ========================== 瀵嗙爜淇濇姢 Ctrl+Enter ========================== */
  var PASSWORD = '2641';

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      openPasswordDialog();
    }
  });

  window.openPasswordDialog = function() {
    document.getElementById('pwdOverlay').classList.add('visible');
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdErr').classList.remove('visible');
    setTimeout(function(){ document.getElementById('pwdInput').focus(); }, 100);
  };

  window.closePasswordDialog = function() {
    document.getElementById('pwdOverlay').classList.remove('visible');
  };

  window.checkPassword = function() {
    var pwd = document.getElementById('pwdInput').value;
    if (pwd === PASSWORD) {
      closePasswordDialog();
      toggleAnswerKey();
    } else {
      document.getElementById('pwdErr').classList.add('visible');
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdInput').focus();
    }
  };

  // 鍥炶溅閿湪瀵嗙爜妗嗗唴鎻愪氦
  document.getElementById('pwdInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); checkPassword(); }
  });

  // 鐐瑰嚮閬僵鍏抽棴
  document.getElementById('pwdOverlay').addEventListener('click', function(e) {
    if (e.target === this) closePasswordDialog();
  });

  function toggleAnswerKey() {
    var ak = document.getElementById('answerKey');
    var isVisible = ak.classList.contains('visible');
    if (isVisible) {
      ak.classList.remove('visible');
      showToast('绛旀宸查殣钘?);
    } else {
      ak.classList.add('visible');
      showToast('绛旀宸叉樉绀?);
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    }
  }

  /* ========================== 鑷姩淇濆瓨 & 鎭㈠ ========================== */
  // 椤甸潰鍔犺浇鏃惰嚜鍔ㄦ仮澶?  window.addEventListener('DOMContentLoaded', function() {
    loadAnswers();
  });

  // 杈撳叆鏃惰嚜鍔ㄤ繚瀛?(闃叉姈)
  var autoSaveTimer = null;
  document.addEventListener('input', function() {
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(function() {
      saveAnswers();
    }, 800);
  });

  /* ========================== MathJax 閲嶇粯 ========================== */
  // 姣忔鍔犺浇绛旀鍚庨渶瑕侀噸缁?  console.log('楂樹竴鏁板绗笁绔犳祴璇曞嵎宸插姞杞姐€傛寜 Ctrl+Enter 鏌ョ湅绛旀銆?);

})();
</script>
