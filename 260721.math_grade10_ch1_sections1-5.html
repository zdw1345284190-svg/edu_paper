  for (let i = 1; i <= 8; i++) {
    const qid = 'q' + i;
    const selected = document.querySelector('input[name="' + qid + '"]:checked');
    const userAns = selected ? selected.value : '';
    const correct = ANSWER_KEY[qid];
    const isCorrect = userAns === correct;
    const score = isCorrect ? SCORE_MAP.single : 0;
    earned += score;
    total += SCORE_MAP.single;
    details.push({
      label: QUESTION_LABELS[qid],
      type: 'single',
      user: userAns || '(鏈綔绛?',
      correct: correct,
      status: isCorrect ? 'correct' : 'wrong',
      score: score
    });
  }

  // 2. 璇勫垎澶氶€夐
  const multiQids = ['q101', 'q102', 'q103'];
  for (const qid of multiQids) {
    const checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
    const userAns = Array.from(checked).map(cb => cb.value);
    const correct = ANSWER_KEY[qid];
    let score = 0;
    let status = 'wrong';
    if (userAns.length === 0) {
      status = 'wrong';
    } else {
      const allCorrectSelected = correct.every(v => userAns.includes(v));
      const hasWrong = userAns.some(v => !correct.includes(v));
      if (allCorrectSelected && !hasWrong) {
        score = SCORE_MAP.multi;  // 鍏ㄥ
        status = 'correct';
      } else if (!hasWrong) {
        score = 2;  // 閮ㄥ垎閫夊
        status = 'partial';
      }
    }
    earned += score;
    total += SCORE_MAP.multi;
    details.push({
      label: QUESTION_LABELS[qid],
      type: 'multi',
      user: userAns.length ? userAns.join(', ') : '(鏈綔绛?',
      correct: correct.join(', '),
      status: status,
      score: score
    });
  }

  // 3. 璇勫垎濉┖棰?  const fillQids = ['q11', 'q12', 'q13', 'q14', 'q15', 'q16'];
  for (const qid of fillQids) {
    const input = document.querySelector('.fill-question[data-qid="' + qid + '"] .fill-input');
    const userAns = input ? normalizeStr(input.value) : '';
    const correct = input ? normalizeStr(input.dataset.answer || '') : '';
    const altRaw = input ? (input.dataset.alt || '') : '';
    const alts = altRaw ? altRaw.split('|').map(s => normalizeStr(s)) : [];
    const isCorrect = userAns === correct || alts.includes(userAns);
    const score = isCorrect ? SCORE_MAP.fill : 0;
    earned += score;
    total += SCORE_MAP.fill;
    details.push({
      label: QUESTION_LABELS[qid],
      type: 'fill',
      user: input ? input.value : '(鏈綔绛?',
      correct: input ? (input.dataset.answer || '') : '',
      status: isCorrect ? 'correct' : 'wrong',
      score: score
    });
  }

  // 4. 瑙ｇ瓟棰橈紙涓嶈嚜鍔ㄨ瘎鍒嗭紝鏍囪"闇€浜哄伐鎵规敼"锛?  const calcQids = ['q17', 'q18', 'q19', 'q20'];
  for (const qid of calcQids) {
    const textarea = document.querySelector('.calc-question[data-qid="' + qid + '"] .answer-area');
    const score = SCORE_MAP.calc[qid] || 0;
    total += score;
    details.push({
      label: QUESTION_LABELS[qid],
      type: 'calc',
      user: textarea && textarea.value.trim() ? '(宸蹭綔绛?' : '(鏈綔绛?',
      correct: '闇€浜哄伐鎵规敼',
      status: 'pending',
      score: '鈥?(' + score + '鍒?'
    });
  }

  return { earned, total, details };
}

// ===== 鎻愪氦璇曞嵎 =====
function submitPaper() {
  saveAnswers();
  const btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = '鈴?璇勫垎涓?..';

  // 瑙﹀彂MathJax閲嶆柊娓叉煋锛堝鏋滄湁鍔ㄦ€佸唴瀹癸級
  const result = gradePaper();
  showScore(result);
  highlightAnswers(result.details);

  btn.textContent = '鉁?宸叉彁浜?;
}

// ===== 鏄剧ず鎴愮哗寮圭獥 =====
function showScore(result) {
  const overlay = document.getElementById('scoreOverlay');
  document.getElementById('earnedScore').textContent = result.earned;
  document.getElementById('totalScore').textContent = result.total;
  const acc = result.total > 0 ? ((result.earned / result.total) * 100).toFixed(1) + '%' : '0%';
  document.getElementById('accuracy').textContent = acc;

  const tbody = document.getElementById('scoreBody');
  tbody.innerHTML = '';
  for (const d of result.details) {
    const tr = document.createElement('tr');
    let statusText = '';
    let statusClass = '';
    if (d.status === 'correct') {
      statusText = '鉁?姝ｇ‘';
      statusClass = 'status-correct';
    } else if (d.status === 'wrong') {
      statusText = '鉂?閿欒';
      statusClass = 'status-wrong';
    } else if (d.status === 'partial') {
      statusText = '鈿狅笍 閮ㄥ垎姝ｇ‘';
      statusClass = 'status-wrong';
    } else {
      statusText = '鈴?寰呮壒鏀?;
      statusClass = '';
    }
    tr.innerHTML = `
      <td>${d.label}</td>
      <td>${d.type === 'single' ? '鍗曢€? : d.type === 'multi' ? '澶氶€? : d.type === 'fill' ? '濉┖' : '瑙ｇ瓟'}</td>
      <td>${d.user}</td>
      <td>${d.correct}</td>
      <td class="${statusClass}">${statusText}</td>
      <td>${d.score}</td>
    `;
    tbody.appendChild(tr);
  }

  overlay.classList.add('show');

  // 鍦ㄥ緱鍒嗚緭鍏ユ爮鏄剧ず鎴愮哗
  const scoreInput = document.querySelector('.info-row input[readonly]');
  if (scoreInput) scoreInput.value = result.earned + '/' + result.total;
}

// ===== 鍏抽棴鎴愮哗寮圭獥 =====
function closeScore() {
  document.getElementById('scoreOverlay').classList.remove('show');
}

// ===== 楂樹寒姝ｈ =====
function highlightAnswers(details) {
  for (const d of details) {
    if (d.type === 'single') {
      const qid = Object.keys(QUESTION_LABELS).find(k => QUESTION_LABELS[k] === d.label);
      if (!qid) continue;
      const container = document.querySelector('.choice-question[data-qid="' + qid + '"]');
      if (!container) continue;
      const radios = container.querySelectorAll('input[type="radio"]');
      radios.forEach(r => {
        const parent = r.closest('label');
        if (!parent) return;
        if (r.checked && r.value === d.correct) {
          parent.classList.add('correct-highlight');
        } else if (r.checked && r.value !== d.correct) {
          parent.classList.add('wrong-highlight');
        }
        // 濡傛灉閫夐敊浜嗭紝鍦ㄩ敊璇瓟妗堟梺鏍囨敞姝ｇ‘绛旀
        if (d.status === 'wrong' && r.value === d.correct) {
          const hint = parent.querySelector('.correct-answer-hint');
          if (!hint) {
            const el = document.createElement('span');
            el.className = 'correct-answer-hint';
            el.textContent = '鉁?姝ｇ‘绛旀';
            parent.appendChild(el);
          }
        }
      });
    } else if (d.type === 'multi') {
      const qid = Object.keys(QUESTION_LABELS).find(k => QUESTION_LABELS[k] === d.label);
      if (!qid) continue;
      const container = document.querySelector('.choice-question[data-qid="' + qid + '"]');
      if (!container) continue;
      const cbs = container.querySelectorAll('input[type="checkbox"]');
      const correctArr = ANSWER_KEY[qid] || [];
      cbs.forEach(cb => {
        const parent = cb.closest('label');
        if (!parent) return;
        const isCorrectChoice = correctArr.includes(cb.value);
        if (cb.checked && isCorrectChoice) {
          parent.classList.add('correct-highlight');
        } else if (cb.checked && !isCorrectChoice) {
          parent.classList.add('wrong-highlight');
        }
        if (d.status === 'wrong' || d.status === 'partial') {
          if (isCorrectChoice && !cb.checked) {
            const hint = parent.querySelector('.correct-answer-hint');
            if (!hint) {
              const el = document.createElement('span');
              el.className = 'correct-answer-hint';
              el.textContent = '鉁?婕忛€?;
              parent.appendChild(el);
            }
          }
        }
      });
    } else if (d.type === 'fill') {
      const qid = Object.keys(QUESTION_LABELS).find(k => QUESTION_LABELS[k] === d.label);
      if (!qid) continue;
      const input = document.querySelector('.fill-question[data-qid="' + qid + '"] .fill-input');
      if (!input) continue;
      if (d.status === 'correct') {
        input.classList.add('correct-highlight');
      } else {
        input.classList.add('wrong-highlight');
      }
    }
  }
}

// ===== 鍙傝€冪瓟妗堝瘑鐮侀攣 =====

  const btn = document.querySelector('.btn-ref');

  // 濡傛灉宸茶В閿侊紝鐩存帴鍒囨崲
  if (answerUnlocked) {
    ref.classList.toggle('show');
    btn.textContent = ref.classList.contains('show') ? '馃檲 闅愯棌鍙傝€冪瓟妗? : '馃摉 鏌ョ湅鍙傝€冪瓟妗?;
    if (ref.classList.contains('show') && window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([ref]);
    }
    return;
  }

  // 鏈В閿侊細寮瑰嚭瀵嗙爜妗?  const pwd = prompt('璇疯緭鍏ュ瘑鐮佹煡鐪嬪弬鑰冪瓟妗堬細');
  if (pwd === '2641') {
    answerUnlocked = true;
    ref.classList.add('show');
    btn.textContent = '馃檲 闅愯棌鍙傝€冪瓟妗?;
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([ref]);
    }
  } else if (pwd !== null) {
    alert('瀵嗙爜閿欒锛屾棤娉曟煡鐪嬪弬鑰冪瓟妗堬紒');
  }
}
