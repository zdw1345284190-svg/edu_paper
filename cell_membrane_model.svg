<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <defs>
    <!-- Membrane background gradient -->
    <linearGradient id="mem-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF2F8"/>
      <stop offset="50%" stop-color="#F5F8FB"/>
      <stop offset="100%" stop-color="#EAF2F8"/>
    </linearGradient>

    <!-- Phospholipid top half: head at (0,0), two wavy tails going down -->
    <g id="pl-top">
      <circle cx="0" cy="0" r="7" fill="#5B9BD5" stroke="#2E75B6" stroke-width="1.2"/>
      <path d="M -3,7 C -9,22 -1,38 -5,55" fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 3,7 C 9,22 1,38 5,55" fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Phospholipid bottom half: two wavy tails going up, head at (0,-55) -->
    <g id="pl-bottom">
      <path d="M -5,0 C -11,-15 -3,-30 -6,-48" fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 5,0 C 11,-15 3,-30 6,-48" fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="-55" r="7" fill="#5B9BD5" stroke="#2E75B6" stroke-width="1.2"/>
    </g>

    <!-- Cholesterol steroid structure -->
    <g id="cholesterol">
      <rect x="-6" y="-5" width="5" height="4.5" rx="0.8" fill="#E74C6F" stroke="#C0392B" stroke-width="0.7"/>
      <rect x="-1" y="-5" width="5" height="4.5" rx="0.8" fill="#E74C6F" stroke="#C0392B" stroke-width="0.7"/>
      <rect x="-6" y="-0.5" width="5" height="4.5" rx="0.8" fill="#E74C6F" stroke="#C0392B" stroke-width="0.7"/>
      <rect x="-1" y="-0.5" width="5" height="4.5" rx="0.8" fill="#E74C6F" stroke="#C0392B" stroke-width="0.7"/>
      <path d="M 4,-3 L 9,-3" stroke="#C0392B" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="-3.5" cy="-7" r="1.8" fill="#E74C6F" stroke="#C0392B" stroke-width="0.6"/>
    </g>

    <!-- Sugar unit (monosaccharide) -->
    <g id="sugar-unit">
      <circle cx="0" cy="0" r="3.5" fill="#F4B183" stroke="#C05A1A" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#FAFBFD"/>

  <!-- Membrane region background -->
  <rect x="5" y="88" width="690" height="164" fill="url(#mem-bg)" rx="3"/>
  <rect x="5" y="88" width="690" height="164" fill="none" stroke="#D5E4F0" stroke-width="0.8" rx="3"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">细胞膜流动镶嵌模型示意图</text>

  <!-- Region labels -->
  <text x="350" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7F8C8D">细胞外侧（细胞外）</text>
  <text x="350" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7F8C8D">细胞内侧（细胞内）</text>

  <!-- ==================== PHOSPHOLIPID BILAYER ==================== -->

  <!-- Top layer phospholipids -->
  <use href="#pl-top" x="22" y="100"/>
  <use href="#pl-top" x="62" y="100"/>
  <!-- x=102: integral protein -->
  <use href="#pl-top" x="142" y="100"/>
  <!-- x=182: glycoprotein -->
  <use href="#pl-top" x="222" y="100"/>
  <!-- x=262: integral protein -->
  <use href="#pl-top" x="302" y="100"/>
  <use href="#pl-top" x="342" y="100"/>
  <use href="#pl-top" x="382" y="100"/>
  <!-- x=422: integral protein -->
  <use href="#pl-top" x="462" y="100"/>
  <!-- x=502: glycoprotein -->
  <use href="#pl-top" x="542" y="100"/>
  <!-- x=582: integral protein -->
  <use href="#pl-top" x="622" y="100"/>
  <use href="#pl-top" x="662" y="100"/>

  <!-- Bottom layer phospholipids -->
  <use href="#pl-bottom" x="22" y="240"/>
  <use href="#pl-bottom" x="62" y="240"/>
  <use href="#pl-bottom" x="142" y="240"/>
  <use href="#pl-bottom" x="222" y="240"/>
  <use href="#pl-bottom" x="302" y="240"/>
  <use href="#pl-bottom" x="342" y="240"/>
  <use href="#pl-bottom" x="382" y="240"/>
  <use href="#pl-bottom" x="462" y="240"/>
  <use href="#pl-bottom" x="542" y="240"/>
  <use href="#pl-bottom" x="622" y="240"/>
  <use href="#pl-bottom" x="662" y="240"/>

  <!-- ==================== INTEGRAL MEMBRANE PROTEINS ==================== -->

  <!-- Integral protein 1 (x=102) -->
  <g>
    <path d="M 92,90 C 84,140 84,195 92,250 L 112,250 C 120,195 120,140 112,90 Z" fill="#70AD47" stroke="#4E7D30" stroke-width="1.2" opacity="0.9"/>
    <!-- Helix indication -->
    <path d="M 98,110 Q 106,120 98,130 Q 90,140 98,150 Q 106,160 98,170 Q 90,180 98,190 Q 106,200 98,210" fill="none" stroke="#4E7D30" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Integral protein 2 (x=262) -->
  <g>
    <path d="M 252,90 C 244,140 244,195 252,250 L 272,250 C 280,195 280,140 272,90 Z" fill="#70AD47" stroke="#4E7D30" stroke-width="1.2" opacity="0.9"/>
    <path d="M 258,110 Q 266,120 258,130 Q 250,140 258,150 Q 266,160 258,170 Q 250,180 258,190 Q 266,200 258,210" fill="none" stroke="#4E7D30" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Integral protein 3 (x=422) -->
  <g>
    <path d="M 412,90 C 404,140 404,195 412,250 L 432,250 C 440,195 440,140 432,90 Z" fill="#70AD47" stroke="#4E7D30" stroke-width="1.2" opacity="0.9"/>
    <path d="M 418,110 Q 426,120 418,130 Q 410,140 418,150 Q 426,160 418,170 Q 410,180 418,190 Q 426,200 418,210" fill="none" stroke="#4E7D30" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Integral protein 4 (x=582) -->
  <g>
    <path d="M 572,90 C 564,140 564,195 572,250 L 592,250 C 600,195 600,140 592,90 Z" fill="#70AD47" stroke="#4E7D30" stroke-width="1.2" opacity="0.9"/>
    <path d="M 578,110 Q 586,120 578,130 Q 570,140 578,150 Q 586,160 578,170 Q 570,180 578,190 Q 586,200 578,210" fill="none" stroke="#4E7D30" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ==================== GLYCOPROTEINS ==================== -->

  <!-- Glycoprotein 1 (x=182) -->
  <g>
    <path d="M 172,90 C 164,140 164,195 172,250 L 192,250 C 200,195 200,140 192,90 Z" fill="#ED7D31" stroke="#C05A1A" stroke-width="1.2" opacity="0.9"/>
    <path d="M 178,110 Q 186,120 178,130 Q 170,140 178,150 Q 186,160 178,170 Q 170,180 178,190 Q 186,200 178,210" fill="none" stroke="#C05A1A" stroke-width="0.8" opacity="0.4"/>

    <!-- Sugar chain A - main chain -->
    <path d="M 177,95 Q 165,82 158,72" fill="none" stroke="#C05A1A" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#sugar-unit" x="158" y="72"/>
    <!-- Branch A1 -->
    <path d="M 158,72 Q 150,62 145,55" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="145" y="55"/>
    <!-- Branch A2 -->
    <path d="M 158,72 Q 165,60 168,52" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="168" y="52"/>

    <!-- Sugar chain B -->
    <path d="M 182,95 Q 195,80 202,70" fill="none" stroke="#C05A1A" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#sugar-unit" x="202" y="70"/>
    <!-- Branch B1 -->
    <path d="M 202,70 Q 210,60 215,53" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="215" y="53"/>
    <!-- Branch B2 -->
    <path d="M 202,70 Q 195,58 192,50" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="192" y="50"/>

    <!-- Sugar chain C (shorter) -->
    <path d="M 187,98 Q 200,88 208,80" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="208" y="80"/>
    <path d="M 208,80 Q 215,72 220,66" fill="none" stroke="#C05A1A" stroke-width="1" stroke-linecap="round"/>
    <use href="#sugar-unit" x="220" y="66"/>
  </g>

  <!-- Glycoprotein 2 (x=502) -->
  <g>
    <path d="M 492,90 C 484,140 484,195 492,250 L 512,250 C 520,195 520,140 512,90 Z" fill="#ED7D31" stroke="#C05A1A" stroke-width="1.2" opacity="0.9"/>
    <path d="M 498,110 Q 506,120 498,130 Q 490,140 498,150 Q 506,160 498,170 Q 490,180 498,190 Q 506,200 498,210" fill="none" stroke="#C05A1A" stroke-width="0.8" opacity="0.4"/>

    <!-- Sugar chain A -->
    <path d="M 497,95 Q 485,82 478,72" fill="none" stroke="#C05A1A" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#sugar-unit" x="478" y="72"/>
    <path d="M 478,72 Q 470,62 465,55" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="465" y="55"/>
    <path d="M 478,72 Q 485,60 488,52" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="488" y="52"/>

    <!-- Sugar chain B -->
    <path d="M 502,95 Q 515,80 522,70" fill="none" stroke="#C05A1A" stroke-width="1.5" stroke-linecap="round"/>
    <use href="#sugar-unit" x="522" y="70"/>
    <path d="M 522,70 Q 530,60 535,53" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="535" y="53"/>
    <path d="M 522,70 Q 515,58 512,50" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="512" y="50"/>

    <!-- Sugar chain C -->
    <path d="M 507,98 Q 520,88 528,80" fill="none" stroke="#C05A1A" stroke-width="1.2" stroke-linecap="round"/>
    <use href="#sugar-unit" x="528" y="80"/>
    <path d="M 528,80 Q 535,72 540,66" fill="none" stroke="#C05A1A" stroke-width="1" stroke-linecap="round"/>
    <use href="#sugar-unit" x="540" y="66"/>
  </g>

  <!-- ==================== CHOLESTEROL MOLECULES ==================== -->

  <use href="#cholesterol" x="42" y="135"/>
  <use href="#cholesterol" x="128" y="135"/>
  <use href="#cholesterol" x="318" y="135"/>
  <use href="#cholesterol" x="358" y="135"/>
  <use href="#cholesterol" x="518" y="135"/>
  <use href="#cholesterol" x="638" y="135"/>

  <!-- ==================== PERIPHERAL PROTEINS (inner surface) ==================== -->

  <g>
    <ellipse cx="142" cy="260" rx="11" ry="7" fill="#9B59B6" stroke="#7D3C98" stroke-width="1" opacity="0.85"/>
    <path d="M 137,258 Q 142,262 147,258" fill="none" stroke="#7D3C98" stroke-width="0.7" opacity="0.5"/>
  </g>

  <g>
    <ellipse cx="322" cy="260" rx="11" ry="7" fill="#9B59B6" stroke="#7D3C98" stroke-width="1" opacity="0.85"/>
    <path d="M 317,258 Q 322,262 327,258" fill="none" stroke="#7D3C98" stroke-width="0.7" opacity="0.5"/>
  </g>

  <g>
    <ellipse cx="462" cy="260" rx="11" ry="7" fill="#9B59B6" stroke="#7D3C98" stroke-width="1" opacity="0.85"/>
    <path d="M 457,258 Q 462,262 467,258" fill="none" stroke="#7D3C98" stroke-width="0.7" opacity="0.5"/>
  </g>

  <g>
    <ellipse cx="542" cy="260" rx="11" ry="7" fill="#9B59B6" stroke="#7D3C98" stroke-width="1" opacity="0.85"/>
    <path d="M 537,258 Q 542,262 547,258" fill="none" stroke="#7D3C98" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- ==================== LABELS ==================== -->

  <!-- 磷脂双分子层 -->
  <text x="350" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">磷脂双分子层</text>
  <line x1="260" y1="175" x2="440" y2="175" stroke="#2C3E50" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- 糖蛋白 -->
  <text x="182" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C05A1A" font-weight="bold">糖蛋白</text>
  <line x1="182" y1="45" x2="182" y2="55" stroke="#C05A1A" stroke-width="0.8"/>

  <!-- 膜蛋白 -->
  <text x="102" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4E7D30" font-weight="bold">膜蛋白</text>
  <line x1="102" y1="305" x2="102" y2="254" stroke="#4E7D30" stroke-width="0.8"/>

  <!-- 胆固醇 -->
  <text x="42" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C0392B" font-weight="bold">胆固醇</text>
  <line x1="42" y1="128" x2="42" y2="133" stroke="#C0392B" stroke-width="0.8"/>

  <!-- 糖链 -->
  <text x="535" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C05A1A" font-weight="bold">糖链</text>
  <line x1="535" y1="45" x2="535" y2="52" stroke="#C05A1A" stroke-width="0.8"/>

  <!-- Additional label: 外周蛋白 -->
  <text x="322" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7D3C98" font-weight="bold">外周蛋白</text>
  <line x1="322" y1="277" x2="322" y2="269" stroke="#7D3C98" stroke-width="0.8"/>

</svg>