        if (num >= 14 && num <= 17) return 'fill';
        return 'essay';
    }

    // ============ Get user answers ============
    function getUserAnswer(qName) {
        const type = getQuestionType(qName);
        if (type === 'single') {
            const el = document.querySelector('input[name="' + qName + '"]:checked');
            return el ? el.value : '';
        }
        if (type === 'multiple') {
            const els = document.querySelectorAll('input[name="' + qName + '"]:checked');
            return Array.from(els).map(function(e) { return e.value; }).sort().join('');
        }
        if (type === 'fill') {
            const el = document.getElementById(qName);
            return el ? el.value.trim() : '';
        }
        return ''; // essay not auto-graded
    }

    // ============ Set user answer (restore) ============
    function setUserAnswer(qName, value) {
        const type = getQuestionType(qName);
        if (type === 'single') {
            if (value) {
                var el = document.querySelector('input[name="' + qName + '"][value="' + value + '"]');
                if (el) el.checked = true;
            }
        } else if (type === 'multiple') {
            if (value) {
                for (var i = 0; i < value.length; i++) {
                    var ch = value.charAt(i);
                    var el = document.querySelector('input[name="' + qName + '"][value="' + ch + '"]');
                    if (el) el.checked = true;
                }
            }
        } else if (type === 'fill') {
            var el = document.getElementById(qName);
            if (el) el.value = value;
        }
    }

    // ============ localStorage Save ============
    function saveAnswers() {
        var data = {};
        for (var key in answerKey) {
            data[key] = getUserAnswer(key);
        }
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch(e) {}
    }

    // ============ localStorage Restore ============
    function restoreAnswers() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            var data = JSON.parse(raw);
            for (var key in answerKey) {
                if (data.hasOwnProperty(key) && data[key] !== '') {
                    setUserAnswer(key, data[key]);
                }
            }
        } catch(e) {}
    }

    // ============ Auto-save on change ============
    function bindAutoSave() {
        var inputs = document.querySelectorAll('input[type="radio"], input[type="checkbox"], .fill-input');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].addEventListener('change', saveAnswers);
            inputs[i].addEventListener('input', saveAnswers);
        }
    }

    // ============ Normalize fill answer ============
    function normalizeFillAnswer(val) {
        val = val.trim();
        // Normalize Chinese colon to English colon
        val = val.replace(/锛?g, ':');
        // Remove trailing units
        val = val.replace(/\s*(m\/s2|m\/s虏|m\/s|m|s|cm)\s*$/i, '');
        // Remove spaces
        val = val.replace(/\s+/g, '');
        return val;
    }

    // ============ Compare fill answers ============
    function fillAnswersMatch(userAns, correctAns) {
        var u = normalizeFillAnswer(userAns);
        var c = normalizeFillAnswer(correctAns);
        if (u === c) return true;
        // Try numeric comparison
        var un = parseFloat(u);
        var cn = parseFloat(c);
        if (!isNaN(un) && !isNaN(cn)) {
            return Math.abs(un - cn) < 0.01;
        }
        return false;
    }

    // ============ Grade single choice ============
    function gradeSingle(qName, userAns, correctAns) {
        return userAns === correctAns ? scoreMap[qName] : 0;
    }

    // ============ Grade multiple choice ============
    function gradeMultiple(qName, userAns, correctAns) {
        if (!userAns) return 0;
        var sel = userAns.split('').sort();
        var ans = correctAns.split('').sort();
        // Check for wrong selections
        for (var i = 0; i < sel.length; i++) {
            if (ans.indexOf(sel[i]) === -1) return 0;
        }
        // Exact match
        if (sel.length === ans.length) return scoreMap[qName];
        // Partial (subset, no wrong)
        if (sel.length > 0 && sel.length < ans.length) return 2;
        return 0;
    }

    // ============ Grade fill in ============
    function gradeFill(qName, userAns, correctAns) {
        if (!userAns) return 0;
        return fillAnswersMatch(userAns, correctAns) ? scoreMap[qName] : 0;
    }

    // ============ Grade all ============
    function gradeAll() {
        var results = {};
        var total = 0;
        for (var key in answerKey) {
            var type = getQuestionType(key);
            var userAns = getUserAnswer(key);
            var correctAns = answerKey[key];
            var score = 0;
            if (type === 'single') {
                score = gradeSingle(key, userAns, correctAns);
            } else if (type === 'multiple') {
                score = gradeMultiple(key, userAns, correctAns);
            } else if (type === 'fill') {
                score = gradeFill(key, userAns, correctAns);
            }
            results[key] = {
                type: type,
                userAns: userAns || '锛堟湭浣滅瓟锛?,
                correctAns: correctAns,
                score: score,
                maxScore: scoreMap[key],
                isCorrect: (type === 'multiple') ? (score === scoreMap[key]) : (score > 0)
            };
            if (type !== 'essay') total += score;
        }
        results._objTotal = total;
        return results;
    }

    // ============ Display results ============
    function displayResults(results) {
        // Show summary
        var summary = document.getElementById('summary');
        summary.style.display = 'block';

        document.getElementById('objScore').textContent = results._objTotal;

        // Build table rows
        var tbody = document.getElementById('resultTableBody');
        tbody.innerHTML = '';

        var sections = [
            { label: '鍗曢€夐 (鍏?0鍒?', ques: ['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10'] },
            { label: '澶氶€夐 (鍏?2鍒?', ques: ['q11','q12','q13'] },
            { label: '濉┖棰?(鍏?2鍒?', ques: ['q14','q15','q16','q17'] }
        ];

        for (var s = 0; s < sections.length; s++) {
            var sec = sections[s];
            // Section header row
            var trHead = document.createElement('tr');
            trHead.className = 'section-row';
            var td1 = document.createElement('td');
            td1.setAttribute('colspan', '5');
            td1.textContent = sec.label;
            trHead.appendChild(td1);
            tbody.appendChild(trHead);

            for (var q = 0; q < sec.ques.length; q++) {
                var key = sec.ques[q];
                var r = results[key];
                var tr = document.createElement('tr');
                var tdQtype = document.createElement('td');
                if (r.type === 'single') tdQtype.textContent = '鍗曢€?;
                else if (r.type === 'multiple') tdQtype.textContent = '澶氶€?;
                else tdQtype.textContent = '濉┖';
                tr.appendChild(tdQtype);

                var tdNum = document.createElement('td');
                tdNum.textContent = key.toUpperCase();
                tr.appendChild(tdNum);

                var tdUser = document.createElement('td');
                tdUser.textContent = r.userAns;
                tr.appendChild(tdUser);

                var tdCorrect = document.createElement('td');
                tdCorrect.textContent = r.correctAns;
                tr.appendChild(tdCorrect);

                var tdScore = document.createElement('td');
                if (r.type === 'multiple') {
                    if (r.score === r.maxScore) tdScore.textContent = r.score + '鍒?(鍏ㄥ)';
                    else if (r.score === 2) tdScore.textContent = '2鍒?(閮ㄥ垎姝ｇ‘)';
                    else tdScore.textContent = '0鍒?;
                } else {
                    tdScore.textContent = r.score + '鍒?;
                }
                tr.appendChild(tdScore);
                tbody.appendChild(tr);
            }
        }

        // Update inline marks
        for (var key in answerKey) {
            var mark = document.getElementById('mark-' + key);
            if (!mark) continue;
            var r = results[key];
            if (r.type === 'single' || r.type === 'fill') {
                if (r.score > 0) {
                    mark.textContent = '鉁?+' + r.score + '鍒?;
                    mark.className = 'result-mark correct';
                } else if (r.userAns === '锛堟湭浣滅瓟锛?) {
                    mark.textContent = '鏈綔绛?(+0鍒?';
                    mark.className = 'result-mark wrong';
                } else {
                    mark.textContent = '鉁?+0鍒?(姝ｇ‘绛旀: ' + r.correctAns + ')';
                    mark.className = 'result-mark wrong';
                }
            } else if (r.type === 'multiple') {
                if (r.score === r.maxScore) {
                    mark.textContent = '鉁?鍏ㄥ (+' + r.score + '鍒?';
                    mark.className = 'result-mark correct';
                } else if (r.score === 2) {
                    mark.textContent = '閮ㄥ垎姝ｇ‘ (+2鍒?';
                    mark.className = 'result-mark partial';
                } else {
                    mark.textContent = '鉁?+0鍒?(姝ｇ‘绛旀: ' + r.correctAns + ')';
                    mark.className = 'result-mark wrong';
                }
            }
        }

        // Show model answers for essay questions
        var essayKeys = ['q18', 'q19', 'q20', 'q21'];
        for (var e = 0; e < essayKeys.length; e++) {
            var ansDiv = document.getElementById('ans-' + essayKeys[e]);
            if (ansDiv) ansDiv.style.display = 'block';
        }

        // Update display score
        document.getElementById('displayScore').textContent = results._objTotal + ' + 涓昏棰?46)';
    }

    // ============ Submit ============
    window.submitTest = function() {
        var pwd = prompt('璇疯緭鍏ユ彁浜ゅ瘑鐮侊細');
        if (pwd === null) return;
        if (pwd !== '2641') {
            alert('瀵嗙爜閿欒锛?);
            return;
        }
        var results = gradeAll();
        displayResults(results);
        // Scroll to summary
        document.getElementById('summary').scrollIntoView({ behavior: 'smooth' });
    };

    // ============ Ctrl+Enter handler ============
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            submitTest();
        }
    });

    // ============ Init ============
    restoreAnswers();
    bindAutoSave();

})();
</script>
