<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6">
      <circle cx="3" cy="3" r="2.5" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="SimHei, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#222">动植物细胞亚显微结构对比图</text>

  <!-- Cell labels -->
  <text x="200" y="65" text-anchor="middle" font-family="SimHei, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333">动物细胞</text>
  <text x="590" y="65" text-anchor="middle" font-family="SimHei, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333">植物细胞</text>

  <!-- ==================== ANIMAL CELL ==================== -->
  <g id="animal-cell">
    <!-- Cell membrane (double line for phospholipid bilayer) -->
    <path d="M 200 185 C 260 185, 315 220, 315 295 C 315 370, 265 415, 200 415 C 135 415, 85 370, 85 295 C 85 220, 140 185, 200 185 Z" fill="#F5F5F5" stroke="#333" stroke-width="2.5"/>
    <path d="M 200 190 C 256 190, 308 223, 308 295 C 308 367, 260 408, 200 408 C 140 408, 92 367, 92 295 C 92 223, 144 190, 200 190 Z" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Nucleus with nuclear envelope and pores -->
    <circle cx="185" cy="270" r="32" fill="#E8D5F5" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="185" cy="270" r="28" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="157" cy="270" r="1.5" fill="#8B5CF6"/>
    <circle cx="213" cy="270" r="1.5" fill="#8B5CF6"/>
    <circle cx="185" cy="238" r="1.5" fill="#8B5CF6"/>
    <circle cx="185" cy="302" r="1.5" fill="#8B5CF6"/>
    <!-- Nucleolus -->
    <circle cx="185" cy="270" r="10" fill="#7C3AED" opacity="0.5"/>

    <!-- Mitochondrion with cristae -->
    <g transform="translate(275, 350)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#FCE4D6" stroke="#E65C2E" stroke-width="1.5"/>
      <path d="M -10 -6 L -7 6" stroke="#E65C2E" stroke-width="1"/>
      <path d="M -4 -8 L -1 8" stroke="#E65C2E" stroke-width="1"/>
      <path d="M 2 -8 L 5 8" stroke="#E65C2E" stroke-width="1"/>
      <path d="M 8 -6 L 11 6" stroke="#E65C2E" stroke-width="1"/>
    </g>

    <!-- Endoplasmic Reticulum (rough ER with ribosomes) -->
    <g transform="translate(145, 310)">
      <path d="M -10 -10 C 0 -15, 10 -10, 15 0 C 20 10, 10 15, 0 10 C -10 5, -15 -5, -10 -10 Z" fill="#D5E8F5" stroke="#4A90D9" stroke-width="1.5"/>
      <path d="M -5 5 C 5 0, 15 5, 17 15 C 19 25, 9 30, 0 25 C -9 20, -10 10, -5 5 Z" fill="#D5E8F5" stroke="#4A90D9" stroke-width="1.5"/>
      <circle cx="-5" cy="-8" r="1.5" fill="#333"/>
      <circle cx="2" cy="-12" r="1.5" fill="#333"/>
      <circle cx="8" cy="-8" r="1.5" fill="#333"/>
      <circle cx="12" cy="-3" r="1.5" fill="#333"/>
    </g>

    <!-- Golgi apparatus with vesicles -->
    <g transform="translate(260, 240)">
      <path d="M -15 0 Q 0 -5, 15 0 Q 0 5, -15 0" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -18 8 Q 0 3, 18 8 Q 0 13, -18 8" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -15 16 Q 0 11, 15 16 Q 0 21, -15 16" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -12 24 Q 0 19, 12 24 Q 0 29, -12 24" fill="none" stroke="#D63384" stroke-width="2"/>
      <circle cx="22" cy="4" r="3" fill="none" stroke="#D63384" stroke-width="1"/>
      <circle cx="-22" cy="12" r="2.5" fill="none" stroke="#D63384" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="none" stroke="#D63384" stroke-width="1"/>
    </g>

    <!-- Ribosomes (free) -->
    <circle cx="230" cy="285" r="2.5" fill="#333"/>
    <circle cx="238" cy="290" r="2.5" fill="#333"/>
    <circle cx="225" cy="295" r="2.5" fill="#333"/>
    <circle cx="242" cy="282" r="2.5" fill="#333"/>
    <circle cx="233" cy="300" r="2.5" fill="#333"/>

    <!-- Centrosome (pair of centrioles) -->
    <g transform="translate(230, 370)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
      <line x1="-8" y1="-3" x2="-8" y2="3" stroke="#333" stroke-width="0.8"/>
      <line x1="-4" y1="-3" x2="-4" y2="3" stroke="#333" stroke-width="0.8"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#333" stroke-width="0.8"/>
      <line x1="4" y1="-3" x2="4" y2="3" stroke="#333" stroke-width="0.8"/>
      <line x1="8" y1="-3" x2="8" y2="3" stroke="#333" stroke-width="0.8"/>
      <rect x="-3" y="-14" width="6" height="24" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
      <line x1="-3" y1="-10" x2="3" y2="-10" stroke="#333" stroke-width="0.8"/>
      <line x1="-3" y1="-6" x2="3" y2="-6" stroke="#333" stroke-width="0.8"/>
      <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#333" stroke-width="0.8"/>
      <line x1="-3" y1="2" x2="3" y2="2" stroke="#333" stroke-width="0.8"/>
      <line x1="-3" y1="6" x2="3" y2="6" stroke="#333" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ==================== PLANT CELL ==================== -->
  <g id="plant-cell">
    <!-- Cell wall -->
    <rect x="475" y="165" width="230" height="270" rx="4" fill="#F5F5F5" stroke="#8B6914" stroke-width="3"/>

    <!-- Cell membrane -->
    <rect x="485" y="175" width="210" height="250" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="485" y="175" width="210" height="250" rx="3" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Nucleus -->
    <circle cx="565" cy="250" r="28" fill="#E8D5F5" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="565" cy="250" r="24" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="540" cy="250" r="1.5" fill="#8B5CF6"/>
    <circle cx="590" cy="250" r="1.5" fill="#8B5CF6"/>
    <circle cx="565" cy="225" r="1.5" fill="#8B5CF6"/>
    <circle cx="565" cy="275" r="1.5" fill="#8B5CF6"/>
    <circle cx="565" cy="250" r="9" fill="#7C3AED" opacity="0.5"/>

    <!-- Mitochondrion -->
    <g transform="translate(660, 370)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#FCE4D6" stroke="#E65C2E" stroke-width="1.5"/>
      <path d="M -10 -6 L -7 6" stroke="#E65C2E" stroke-width="1"/>
      <path d="M -4 -8 L -1 8" stroke="#E65C2E" stroke-width="1"/>
      <path d="M 2 -8 L 5 8" stroke="#E65C2E" stroke-width="1"/>
      <path d="M 8 -6 L 11 6" stroke="#E65C2E" stroke-width="1"/>
    </g>

    <!-- Endoplasmic Reticulum -->
    <g transform="translate(535, 330)">
      <path d="M -10 -10 C 0 -15, 10 -10, 15 0 C 20 10, 10 15, 0 10 C -10 5, -15 -5, -10 -10 Z" fill="#D5E8F5" stroke="#4A90D9" stroke-width="1.5"/>
      <path d="M -5 5 C 5 0, 15 5, 17 15 C 19 25, 9 30, 0 25 C -9 20, -10 10, -5 5 Z" fill="#D5E8F5" stroke="#4A90D9" stroke-width="1.5"/>
      <circle cx="-5" cy="-8" r="1.5" fill="#333"/>
      <circle cx="2" cy="-12" r="1.5" fill="#333"/>
      <circle cx="8" cy="-8" r="1.5" fill="#333"/>
    </g>

    <!-- Golgi apparatus -->
    <g transform="translate(645, 245)">
      <path d="M -15 0 Q 0 -5, 15 0 Q 0 5, -15 0" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -18 8 Q 0 3, 18 8 Q 0 13, -18 8" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -15 16 Q 0 11, 15 16 Q 0 21, -15 16" fill="none" stroke="#D63384" stroke-width="2"/>
      <path d="M -12 24 Q 0 19, 12 24 Q 0 29, -12 24" fill="none" stroke="#D63384" stroke-width="2"/>
      <circle cx="22" cy="4" r="3" fill="none" stroke="#D63384" stroke-width="1"/>
      <circle cx="-22" cy="12" r="2.5" fill="none" stroke="#D63384" stroke-width="1"/>
    </g>

    <!-- Ribosomes -->
    <circle cx="570" cy="290" r="2.5" fill="#333"/>
    <circle cx="578" cy="295" r="2.5" fill="#333"/>
    <circle cx="565" cy="300" r="2.5" fill="#333"/>
    <circle cx="582" cy="287" r="2.5" fill="#333"/>
    <circle cx="573" cy="305" r="2.5" fill="#333"/>

    <!-- Chloroplast with grana -->
    <g transform="translate(660, 280)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="#D5F5D5" stroke="#2E7D32" stroke-width="1.5"/>
      <rect x="-12" y="-6" width="6" height="12" rx="1" fill="#4CAF50" opacity="0.5"/>
      <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#4CAF50" opacity="0.5"/>
      <rect x="6" y="-5" width="6" height="10" rx="1" fill="#4CAF50" opacity="0.5"/>
      <line x1="-6" y1="-2" x2="-3" y2="-2" stroke="#4CAF50" stroke-width="0.8"/>
      <line x1="-6" y1="2" x2="-3" y2="2" stroke="#4CAF50" stroke-width="0.8"/>
      <line x1="3" y1="-2" x2="6" y2="-2" stroke="#4CAF50" stroke-width="0.8"/>
      <line x1="3" y1="2" x2="6" y2="2" stroke="#4CAF50" stroke-width="0.8"/>
    </g>

    <!-- Central vacuole -->
    <ellipse cx="600" cy="340" rx="45" ry="55" fill="#E8F0F8" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>

  <!-- ==================== LEADER LINES ==================== -->
  <g id="leader-lines" stroke="#555" stroke-width="1" fill="none">
    <!-- Animal cell - left side -->
    <line x1="40" y1="195" x2="105" y2="195"/>
    <line x1="40" y1="270" x2="153" y2="270"/>
    <line x1="40" y1="310" x2="140" y2="310"/>
    <line x1="40" y1="370" x2="225" y2="370"/>

    <!-- Animal cell - right side -->
    <line x1="360" y1="240" x2="275" y2="240"/>
    <line x1="360" y1="290" x2="240" y2="290"/>
    <line x1="360" y1="350" x2="290" y2="350"/>

    <!-- Plant cell - left side -->
    <line x1="460" y1="295" x2="575" y2="295"/>
    <line x1="460" y1="330" x2="540" y2="330"/>

    <!-- Plant cell - right side -->
    <line x1="750" y1="180" x2="705" y2="180"/>
    <line x1="750" y1="220" x2="695" y2="220"/>
    <line x1="750" y1="260" x2="650" y2="245"/>
    <line x1="750" y1="300" x2="593" y2="250"/>
    <line x1="750" y1="340" x2="678" y2="280"/>
    <line x1="750" y1="380" x2="645" y2="340"/>
    <line x1="750" y1="420" x2="678" y2="370"/>
  </g>

  <!-- Leader line endpoint dots -->
  <g fill="#555">
    <circle cx="105" cy="195" r="2.5"/>
    <circle cx="153" cy="270" r="2.5"/>
    <circle cx="140" cy="310" r="2.5"/>
    <circle cx="225" cy="370" r="2.5"/>
    <circle cx="275" cy="240" r="2.5"/>
    <circle cx="240" cy="290" r="2.5"/>
    <circle cx="290" cy="350" r="2.5"/>
    <circle cx="575" cy="295" r="2.5"/>
    <circle cx="540" cy="330" r="2.5"/>
    <circle cx="705" cy="180" r="2.5"/>
    <circle cx="695" cy="220" r="2.5"/>
    <circle cx="650" cy="245" r="2.5"/>
    <circle cx="593" cy="250" r="2.5"/>
    <circle cx="678" cy="280" r="2.5"/>
    <circle cx="645" cy="340" r="2.5"/>
    <circle cx="678" cy="370" r="2.5"/>
  </g>

  <!-- ==================== LABELS ==================== -->
  <g font-family="SimHei, 'Microsoft YaHei', sans-serif" font-size="12" fill="#333">
    <!-- Animal cell - left side -->
    <text x="35" y="199" text-anchor="end">细胞膜</text>
    <text x="35" y="274" text-anchor="end">细胞核</text>
    <text x="35" y="314" text-anchor="end">内质网</text>
    <text x="35" y="374" text-anchor="end">中心体</text>

    <!-- Animal cell - right side -->
    <text x="360" y="244" text-anchor="start">高尔基体</text>
    <text x="360" y="294" text-anchor="start">核糖体</text>
    <text x="360" y="354" text-anchor="start">线粒体</text>

    <!-- Plant cell - left side -->
    <text x="460" y="299" text-anchor="end">核糖体</text>
    <text x="460" y="334" text-anchor="end">内质网</text>

    <!-- Plant cell - right side -->
    <text x="750" y="184" text-anchor="start">细胞壁</text>
    <text x="750" y="224" text-anchor="start">细胞膜</text>
    <text x="750" y="264" text-anchor="start">高尔基体</text>
    <text x="750" y="304" text-anchor="start">细胞核</text>
    <text x="750" y="344" text-anchor="start">叶绿体</text>
    <text x="750" y="384" text-anchor="start">液泡</text>
    <text x="750" y="424" text-anchor="start">线粒体</text>
  </g>
</svg>
